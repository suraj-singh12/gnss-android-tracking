name: Probe external Overpass endpoints
on:
  push:
    branches: [fix/main-map-preview-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test real Overpass endpoints from runner
        shell: bash
        run: |
          set -u
          for endpoint in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "::group::Probe $endpoint"
            for attempt in 1 2; do
              echo "Attempt $attempt"
              curl --silent --show-error --location --max-time 22 --connect-timeout 8 \
                --output "/tmp/overpass-${attempt}.body" \
                --write-out 'HTTP=%{http_code} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TLS=%{time_appconnect}s TTFB=%{time_starttransfer}s TOTAL=%{time_total}s SIZE=%{size_download}\n' \
                --data-urlencode 'data=[out:json][timeout:12];node(1);out 1;' "$endpoint" || echo "curl exit=$?"
              head -c 180 "/tmp/overpass-${attempt}.body" 2>/dev/null || true
              echo
            done
            echo "::endgroup::"
          done
