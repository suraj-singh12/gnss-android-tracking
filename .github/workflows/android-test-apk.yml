name: Issue 4 + SOS matched physical acceptance assets

on:
  push:
    branches:
      - test-assets-android-issue-4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-matched-assets:
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: b23b5f58845c896e7fb2c5800e577202667c1e3f
      ASSET_DIR: ${{ runner.temp }}/gnss-matched-assets
    steps:
      - name: Check out temporary workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated workflow commit and check out frozen product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          changed_files=$(git diff --name-only "$SOURCE_REVISION" HEAD)
          test "$changed_files" = ".github/workflows/android-test-apk.yml"
          git checkout --detach "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test -z "$(git status --porcelain)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses </dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Android debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK and embedded product revision
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          generated=android/app/build/generated/source/buildConfig/debug/org/gnss/tracking/BuildConfig.java
          grep -F "SOURCE_REVISION = \"$SOURCE_REVISION\"" "$generated"
          python3 - "$apk" "$SOURCE_REVISION" <<'PY'
          import sys
          import zipfile

          apk, revision = sys.argv[1], sys.argv[2].encode()
          with zipfile.ZipFile(apk) as archive:
              dex_files = [name for name in archive.namelist() if name.startswith("classes") and name.endswith(".dex")]
              assert dex_files, "APK contains no DEX files"
              assert any(revision in archive.read(name) for name in dex_files), "frozen revision missing from APK DEX files"
          print(f"Verified {revision.decode()} in APK DEX files")
          PY

      - name: Set up Go 1.24.7
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: true
          cache-dependency-path: command/go.sum

      - name: Build portable Command binaries from frozen source
        working-directory: command
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ASSET_DIR"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -buildvcs=true -o "$ASSET_DIR/gnss-command-darwin-arm64" ./cmd/party-tracker
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=true -o "$ASSET_DIR/gnss-command-windows-amd64.exe" ./cmd/party-tracker

      - name: Verify matched source identities and create checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          for target in darwin-arm64 windows-amd64.exe; do
            binary="$ASSET_DIR/gnss-command-$target"
            test -s "$binary"
            info=$(go version -m "$binary")
            printf '%s\n' "$info" > "$ASSET_DIR/$target-build-info.txt"
            printf '%s\n' "$info"
            grep -F "vcs.revision=$SOURCE_REVISION" <<< "$info"
            grep -F 'vcs.modified=false' <<< "$info"
            grep -F 'CGO_ENABLED=0' <<< "$info"
            if [[ "$target" == darwin-arm64 ]]; then
              grep -F 'GOOS=darwin' <<< "$info"
              grep -F 'GOARCH=arm64' <<< "$info"
            else
              grep -F 'GOOS=windows' <<< "$info"
              grep -F 'GOARCH=amd64' <<< "$info"
            fi
          done
          cp android/app/build/outputs/apk/debug/app-debug.apk "$ASSET_DIR/"
          python3 - <<'PY_MANIFEST'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['ASSET_DIR'])
          names = ['app-debug.apk', 'gnss-command-darwin-arm64', 'gnss-command-windows-amd64.exe']
          assets = {name: {'sha256': hashlib.sha256((root/name).read_bytes()).hexdigest(), 'bytes': (root/name).stat().st_size} for name in names}
          manifest = {'schema_version': 1, 'source_revision': os.environ['SOURCE_REVISION'], 'workflow_revision': os.environ['GITHUB_SHA'], 'android_java': 17, 'android_sdk': 35, 'go': '1.24.7', 'CGO_ENABLED': 0, 'assets': assets}
          (root/'manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join(f"{v['sha256']}  {name}\n" for name,v in assets.items()))
          print(json.dumps(manifest, indent=2))
          for folder, file in [('android', names[0]), ('macos', names[1]), ('windows', names[2])]:
              out = root/folder
              out.mkdir()
              for name in [file, 'manifest.json', 'SHA256SUMS']:
                  (out/name).write_bytes((root/name).read_bytes())
          PY_MANIFEST

      - name: Upload matched Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gnss-android-issue4-5-b23b5f5-debug-apk
          path: ${{ env.ASSET_DIR }}/android/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload matched macOS ARM64 Command
        uses: actions/upload-artifact@v4
        with:
          name: gnss-command-issue4-5-b23b5f5-darwin-arm64
          path: ${{ env.ASSET_DIR }}/macos/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload matched Windows AMD64 Command
        uses: actions/upload-artifact@v4
        with:
          name: gnss-command-issue4-5-b23b5f5-windows-amd64
          path: ${{ env.ASSET_DIR }}/windows/*
          if-no-files-found: error
          retention-days: 14
