name: Integrated validation and matched acceptance assets
on:
  push:
    branches:
      [
        main,
        issue-6-integrated-ui,
        integration/issue6-physical-button,
        correction/issue6-operational-ux,
        feature/issue6-terrain-appearance,
        feature/issue6-automatic-dem,
        feature/issue6-dem-reliability-map-ui,
        integration/for-main-history-reconstruction,
      ]
  pull_request:
    branches: [integration/combined-upgrades]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: gnss-integrated-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  dem-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: command/go.sum
      - name: Acquire and decode real public DEM
        env:
          GNSS_TERRAIN_PROVIDER_REPORT: ${{ runner.temp }}/dem-evidence/dem-source-probe.json
        run: |
          mkdir -p "$RUNNER_TEMP/dem-evidence"
          node test-tools/integration/dem-acquisition.cjs
      - name: Real automatic DEM acquisition, geographic alignment and offline restart
        env:
          GNSS_TERRAIN_PROVIDER_REPORT: ${{ runner.temp }}/dem-evidence/terrain-provider-check.json
          GNSS_COMMAND_BINARY: ${{ runner.temp }}/gnss-dem-command
          GNSS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/gnss-dem-browser/node_modules/playwright
          GNSS_SCREENSHOT_DIR: ${{ runner.temp }}/dem-evidence/visual-evidence
          GNSS_DEM_LAT: "27.3739"
          GNSS_DEM_LON: "88.7618"
          GNSS_DEM_SIZE: "1000"
        run: |
          (cd command && go build -o "$RUNNER_TEMP/gnss-dem-command" ./cmd/party-tracker)
          npm install --prefix "$RUNNER_TEMP/gnss-dem-browser" playwright
          "$RUNNER_TEMP/gnss-dem-browser/node_modules/.bin/playwright" install --with-deps chromium
          node test-tools/integration/dem-offline-acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEM-provider-acquisition
          path: ${{ runner.temp }}/dem-evidence
          if-no-files-found: error
  integrated:
    # External provider evidence has its own job/artifact; GNSS validation is independent.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Define visual evidence directory
        run: echo "GNSS_SCREENSHOT_DIR=$RUNNER_TEMP/gnss-assets/visual-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: command/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ancestry and source cleanliness
        run: |
          git merge-base --is-ancestor d78ef85e689ca43281127599e814b04cb99aefc8 HEAD
          test -z "$(git status --porcelain)"
      - name: Android tests, lint and debug APK
        env:
          GNSS_ADAPTIVE_REPORT: ${{ runner.temp }}/gnss-test-reports/adaptive-accuracy.json
        working-directory: android
        run: |
          mkdir -p "$RUNNER_TEMP/gnss-test-reports"
          ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          roots=[E.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ['tests','failures','errors','skipped']}
          print('Android full suite:',totals)
          for r in roots:
              if 'PhysicalButton' in r.get('name','') or 'SosHold' in r.get('name','') or 'SosActivity' in r.get('name',''):
                  print(r.get('name'),{k:r.get(k) for k in totals})
          PY
          mkdir -p "$RUNNER_TEMP/gnss-test-reports/android-full"
          cp -R app/build/reports app/build/test-results "$RUNNER_TEMP/gnss-test-reports/android-full/"
      - name: Go tests and protocol checks
        run: |
          (cd command && go test -race ./... && go vet ./...)
          (cd test-tools && go test -race ./... && go vet ./...)
          node test-tools/integration/map-test.cjs
          node test-tools/integration/sos-alarm-test.cjs
          node test-tools/integration/terrain-test.cjs
      - name: Measured simultaneous durable synchronization
        env:
          GNSS_SYNC_BENCH: "1"
          GNSS_SYNC_PRIORITY: "1"
          GNSS_SYNC_PATTERN: "bursts"
          GNSS_SYNC_BATCH: "64000"
          GNSS_SYNC_DEVICES: "20"
          GNSS_SYNC_SAMPLES: "600"
          GNSS_SYNC_DAYS: "7"
        working-directory: command
        run: |
          mkdir -p "$RUNNER_TEMP/gnss-test-reports"
          go test ./internal/core -run '^TestSyncFleetPerformance$' -count=1 -v | tee "$RUNNER_TEMP/gnss-test-reports/sync-benchmark.txt"
      - name: Authenticated controls under saturated history and fresh SOS/LIVE
        env:
          GNSS_CONTROL_LOAD: "1"
        working-directory: command
        run: go test -race ./internal/core -run '^TestFreshPriorityAndLateJoinDuringActualSlowWriterSaturation$' -count=1 -v | tee "$RUNNER_TEMP/gnss-test-reports/control-priority.txt"
      - name: Real Android to Command integration
        env:
          GNSS_ADAPTIVE_REPORT: ${{ runner.temp }}/gnss-test-reports/adaptive-accuracy.json
        run: test-tools/integration/run.sh --console=plain
      - name: Record cross-language test counts
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          found=False
          for p in pathlib.Path('android/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              r=E.parse(p).getroot()
              if r.get('name','').endswith('CommandIntegrationTest'):
                  found=True
                  print('Real Android-to-Command:',{k:r.get(k) for k in ['tests','failures','errors','skipped']})
                  assert int(r.get('tests',0)) > 0
                  assert all(int(r.get(k,0)) == 0 for k in ['failures','errors','skipped'])
          assert found, 'Real bridge result is required, not silently absent'
          PY
      - name: Build matched portable Command applications
        working-directory: command
        run: |
          mkdir -p "$RUNNER_TEMP/gnss-assets"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -buildvcs=true -o "$RUNNER_TEMP/gnss-assets/GNSS-Command-macos-arm64" ./cmd/party-tracker
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=true -o "$RUNNER_TEMP/gnss-assets/GNSS-Command-windows-x64.exe" ./cmd/party-tracker
          go build -o "$RUNNER_TEMP/gnss-command-linux" ./cmd/party-tracker
      - name: Attempt bounded real online map acceptance and record external result
        id: map-acceptance
        continue-on-error: true
        env:
          GNSS_COMMAND_BINARY: ${{ runner.temp }}/gnss-command-linux
          GNSS_MAP_ACCEPTANCE_REPORT: ${{ runner.temp }}/gnss-assets/map-online-acceptance.json
        run: node test-tools/integration/map-online-acceptance.cjs
      - name: Browser verification including SOS and offline maps
        run: |
          npm install --prefix "$RUNNER_TEMP/gnss-browser" playwright @axe-core/playwright
          "$RUNNER_TEMP/gnss-browser/node_modules/.bin/playwright" install --with-deps chromium
          export GNSS_COMMAND_BINARY="$RUNNER_TEMP/gnss-command-linux"
          export GNSS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/gnss-browser/node_modules/playwright"
          export GNSS_AXE_MODULE="$RUNNER_TEMP/gnss-browser/node_modules/@axe-core/playwright"
          export GNSS_SCREENSHOT_DIR="$RUNNER_TEMP/gnss-assets/visual-evidence"
          node test-tools/integration/sos-dashboard.cjs
          node test-tools/integration/ui-dashboard.cjs
          node test-tools/integration/control-ui.cjs
          node test-tools/integration/history-dashboard.cjs
          GNSS_STABILITY_REPORT="$RUNNER_TEMP/gnss-assets/windows-stability.json" node test-tools/integration/windows-stability.cjs
          node test-tools/integration/map-download-ui.cjs
          export GNSS_SYNC_REPORT="$RUNNER_TEMP/gnss-test-reports/sync-process-browser.json"
          (cd command && go test -c -o "$RUNNER_TEMP/gnss-sync-reference" ./internal/core)
          export GNSS_SYNC_REFERENCE_BINARY="$RUNNER_TEMP/gnss-sync-reference"
          node test-tools/integration/sync-capacity.cjs
      - name: Verify exact revisions and generate checksum manifest
        env:
          ASSET_DIR: ${{ runner.temp }}/gnss-assets
        run: |
          test -z "$(git status --porcelain)"
          for binary in "$ASSET_DIR/GNSS-Command-macos-arm64" "$ASSET_DIR/GNSS-Command-windows-x64.exe"; do
            go version -m "$binary" | tee "$binary.build-info.txt"
            go version -m "$binary" | grep -F "vcs.revision=$SOURCE_REVISION"
            go version -m "$binary" | grep -F 'vcs.modified=false'
          done
          cp android/app/build/outputs/apk/debug/app-debug.apk "$ASSET_DIR/GNSS-Tracker-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$ASSET_DIR/GNSS-Tracker-debug.apk" | tee "$ASSET_DIR/android-package.txt"
          grep -F "package: name='org.gnss.tracking'" "$ASSET_DIR/android-package.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$ASSET_DIR/GNSS-Tracker-debug.apk" | tee "$ASSET_DIR/android-signing.txt"
          cp docs/ui-acceptance.md "$ASSET_DIR/SETUP.md"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['ASSET_DIR']); sha=os.environ['SOURCE_REVISION']
          names=['GNSS-Tracker-debug.apk','GNSS-Command-macos-arm64','GNSS-Command-windows-x64.exe']
          with zipfile.ZipFile(root/names[0]) as z:
              assert any(sha.encode() in z.read(n) for n in z.namelist() if n.endswith('.dex'))
          assets={n:{'sha256':hashlib.sha256((root/n).read_bytes()).hexdigest(),'bytes':(root/n).stat().st_size} for n in names}
          manifest={'source_revision':sha,'android_version':'0.1','command_protocol':1,'android_min_sdk':26,'android_target_sdk':35,'assets':assets}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join(f"{a['sha256']}  {n}\n" for n,a in assets.items()))
          print(json.dumps(manifest,indent=2))
          PY
          cat "$ASSET_DIR/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: GNSS-Tracker-Android-debug
          path: ${{ runner.temp }}/gnss-assets/GNSS-Tracker-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: GNSS-Command-macOS-arm64
          path: ${{ runner.temp }}/gnss-assets/GNSS-Command-macos-arm64
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: GNSS-Command-Windows-x64
          path: ${{ runner.temp }}/gnss-assets/GNSS-Command-windows-x64.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: GNSS-Acceptance-Evidence-${{ env.SOURCE_REVISION }}
          path: |
            ${{ runner.temp }}/gnss-assets/*.txt
            ${{ runner.temp }}/gnss-assets/*.json
            ${{ runner.temp }}/gnss-assets/*.md
            ${{ runner.temp }}/gnss-assets/SHA256SUMS
            ${{ runner.temp }}/gnss-assets/visual-evidence
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnss-issue6-test-reports-${{ env.SOURCE_REVISION }}
          path: |
            ${{ runner.temp }}/gnss-test-reports
            android/app/build/reports
            android/app/build/test-results
            ${{ runner.temp }}/gnss-assets/visual-evidence
      - name: Preserve external map acceptance failure after uploading evidence
        if: ${{ always() && steps.map-acceptance.outcome == 'failure' }}
        run: |
          echo "External Overpass/map acceptance failed. Software checks and artifacts do not waive this gate."
          exit 1
