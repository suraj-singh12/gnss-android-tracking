<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GNSS Tracker · Interactive Android Design V4</title><style>

*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font:14px/1.42 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:#dce5e6}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}[hidden]{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6799f5;outline-offset:2px}
.shell{height:100dvh;display:flex;justify-content:center;align-items:center;padding:13px}.phone{width:min(100%,430px);height:min(100%,866px);border-radius:27px;box-shadow:var(--shadow);background:var(--bg);border:1px solid #c0d0d2;overflow:hidden;display:flex;flex-direction:column;position:relative}.status-bar{height:27px;flex-shrink:0;padding:6px 20px 0;display:flex;justify-content:space-between;font-size:10.5px;font-weight:650}.appbar{height:51px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 18px}.brand-icon{width:30px;height:30px;border-radius:10px;background:#176d60;color:white;display:grid;place-items:center;font-size:16px;font-weight:750;flex-shrink:0}.appbar h1{font-size:16px;line-height:1.25;font-weight:760;margin:0;letter-spacing:-.22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appbar small{color:var(--muted);font-size:10px;display:block;line-height:1.3}.spacer{flex:1}.iconbtn{width:37px;height:37px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;flex-shrink:0}.iconbtn.flat{border-color:transparent;background:transparent}.ico{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.viewport{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:11px 17px 17px}.viewtitle{font-size:23px;letter-spacing:-.55px;line-height:1.15;font-weight:760;margin:2px 0 4px}.lead{color:var(--muted);font-size:11.5px;line-height:1.4;margin:0 0 15px}.card{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:14px;margin-bottom:11px;min-width:0}.hero{padding:0;overflow:hidden}.hero-top{padding:16px 15px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.hero-top b{font-size:15px}.hero-top small{color:var(--muted);display:block;font-size:11.5px;margin-top:4px}.hero-action{padding:0 14px 14px}.btn{min-height:43px;border-radius:11px;border:1px solid var(--line);background:var(--paper);font-weight:720;padding:10px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center;min-width:0}.btn.primary{background:#176d60;border-color:#176d60;color:#fff}.btn.primary:hover:not(:disabled){background:#125749}.btn.secondary{background:var(--wash)}.btn.danger{background:var(--burgwash);color:var(--burg);border-color:#ddbdc6}.btn.full{width:100%}.btn.small{min-height:34px;font-size:11.5px;padding:7px 10px}.status{border-radius:20px;padding:5px 9px;background:var(--tealwash);color:var(--teal);font-size:10.5px;font-weight:760;white-space:nowrap}.status.warn{background:var(--amberwash);color:var(--amber)}.status.danger{background:var(--burgwash);color:var(--burg)}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.cardhead b{font-size:14px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{min-width:0}.metric+.metric{padding-left:14px;border-left:1px solid var(--line)}.metric strong{display:block;font-size:26px;font-weight:770;line-height:1.17;letter-spacing:-.5px}.metric small{display:block;margin-top:4px;color:var(--muted);font-size:10.5px}.card-foot{margin:13px -14px -14px;padding:10px 14px;background:var(--wash);border-top:1px solid var(--line);border-radius:0 0 16px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.card-foot .foot-copy{font-size:11px;color:var(--muted);min-width:0;line-height:1.4}.card-foot .btn{flex-shrink:0}.card-action{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}.note{font-size:11.5px;color:var(--muted);background:var(--wash);border:1px solid var(--line);padding:11px 12px;border-radius:12px;line-height:1.45}
.sec-title{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:760;letter-spacing:.8px;margin:19px 2px 9px}.list{border:1px solid var(--line);border-radius:15px;background:var(--paper);overflow:hidden}.listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;padding:13px 14px;min-height:60px}.listrow:first-child{border-top:0}.listrow:hover{background:var(--wash)}.listrow b{display:block;font-size:12.5px}.listrow small{display:block;color:var(--muted);font-size:10.5px;line-height:1.4;margin-top:3px;overflow-wrap:anywhere}.chevron{color:var(--muted);font-size:19px;flex-shrink:0}.health{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:11px 0}.health:last-child{border:0}.health-icon{width:21px;flex-shrink:0;text-align:center;color:var(--muted)}.health-copy{min-width:0;flex:1}.health-copy b{font-size:12px;display:block}.health-copy small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.health .status{flex-shrink:0}.field{margin:0 0 15px}.field label{display:block;font-weight:720;font-size:11px;margin:0 0 6px}.field input,.field select,.field textarea{border:1px solid #b9c9c9;background:var(--paper);width:100%;min-height:43px;border-radius:10px;padding:10px 11px}.field .hint{font-size:10.5px;color:var(--muted);margin-top:5px}.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.switchrow:last-child{border:0}.switchrow b{font-size:12px}.switchrow small{font-size:10.5px;color:var(--muted);display:block;line-height:1.4;margin-top:4px}.switch{position:relative;width:49px;height:30px;background:#cbd7d7;border:0;border-radius:99px;flex-shrink:0}.switch.on{background:#176d60}.switch::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0002;transition:transform .14s}.switch.on::after{transform:translateX(19px)}.row-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.row-actions .btn{flex:1}
.footer{flex-shrink:0;background:var(--paper);border-top:1px solid var(--line);padding:8px 12px 4px}.sosbox{background:var(--burgwash);border-radius:12px;padding:7px 9px}.sos-caption{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:10px;color:var(--burg);font-weight:760;padding:0 2px 6px}.sos-button{width:100%;height:43px;border-radius:9px;background:#833c4a;color:white;border:0;font-weight:770;position:relative;overflow:hidden;touch-action:none}.sos-progress{position:absolute;left:0;top:0;bottom:0;background:#ffffff42;width:0;pointer-events:none}.sos-button span{position:relative;z-index:2}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.navbutton{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:49px;border:0;background:transparent;border-radius:10px;font-size:10px;color:var(--muted)}.navbutton .ico{width:19px;height:19px}.navbutton.current{color:var(--teal);background:var(--tealwash);font-weight:760}.home{height:4px;width:88px;border-radius:9px;background:#586568;margin:8px auto 2px}
.dialog-backdrop{position:absolute;inset:0;z-index:20;background:#1423298c;display:none;justify-content:center;align-items:center;padding:12px}.dialog-backdrop.open{display:flex}.dialog{background:var(--paper);border:1px solid var(--line);border-radius:18px;width:100%;max-height:calc(100% - 16px);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}.dialog-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.dialog-head b{font-size:16px}.dialog-head small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.dialog-body{padding:16px;overflow:auto}.dialog-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.dialog-foot .btn{min-height:40px}.toast{position:absolute;bottom:157px;left:14px;right:14px;background:#263f48;color:white;padding:10px 12px;border-radius:11px;font-size:11.5px;z-index:30;display:none;box-shadow:var(--shadow)}.toast.show{display:block}
@media(max-width:500px){body{background:var(--bg)}.shell{padding:0}.phone{height:100dvh;width:100vw;max-width:none;border:0;border-radius:0;box-shadow:none}}@media(max-height:700px){.viewport{padding-top:7px}.hero-top{padding-top:12px}.card{padding:12px}.card-foot{margin:12px -12px -12px}.footer{padding-top:5px}.sosbox{padding:5px}.sos-button{height:40px}.navbutton{min-height:41px}}
</style></head><body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h13"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4a8.5 8.5 0 1 0 11.5 11.5Z"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93 6.35 6.35M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></symbol><symbol id="i-location" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 3.5a2 2 0 0 1 2 2l2 .8 2-.7 2 3.5-1.7 1.4v3l1.7 1.4-2 3.5-2-.7-2 .8a2 2 0 0 1-4 0l-2-.8-2 .7-2-3.5L5.7 13v-3L4 8.6l2-3.5 2 .7 2-.8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-activity" viewBox="0 0 24 24"><path d="M2 12h4l3-7 5 14 3-7h5"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5 11-11"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol></svg>
<div class="shell"><div class="phone" id="phone"><div class="status-bar"><span>8:21</span><span>◖ ▰ ◼</span></div><header class="appbar"><button id="back" class="iconbtn flat" data-act="back" hidden aria-label="Back"><svg class="ico"><use href="#i-back"/></svg></button><div id="brandIcon" class="brand-icon">G</div><div style="min-width:0"><h1 id="appTitle">GNSS Tracker</h1><small id="appSubtitle">Operator device · interactive proposal</small></div><span class="spacer"></span><button class="iconbtn" data-act="theme" aria-label="Toggle Day and Night"><svg class="ico"><use id="themeIcon" href="#i-moon"/></svg></button></header><main id="screen" class="viewport"></main><footer class="footer"><div class="sosbox"><div class="sos-caption"><span>Emergency SOS</span><span id="sosStatus">Hold 1.2 seconds</span></div><button class="sos-button" id="sosBtn" aria-label="Hold to activate SOS"><div class="sos-progress" id="sosProgress"></div><span id="sosText">Hold to activate SOS</span></button></div><nav class="nav" aria-label="Main navigation"><button class="navbutton current" data-act="nav" data-screen="tracking"><svg class="ico"><use href="#i-location"/></svg><span>Tracking</span></button><button class="navbutton" data-act="nav" data-screen="settings"><svg class="ico"><use href="#i-settings"/></svg><span>Settings</span></button><button class="navbutton" data-act="nav" data-screen="diagnostics"><svg class="ico"><use href="#i-activity"/></svg><span>Diagnostics</span></button></nav><div class="home"></div></footer><div id="dialogBackdrop" class="dialog-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><div><b id="dialogTitle"></b><small id="dialogSub"></small></div><button class="iconbtn flat" data-act="close-dialog" aria-label="Close dialog"><svg class="ico"><use href="#i-close"/></svg></button></div><div class="dialog-body" id="dialogBody"></div><div class="dialog-foot" id="dialogFoot"></div></div></div><div class="toast" id="toast" role="status"></div></div></div>
<script>
const $=id=>document.getElementById(id),escapeHtml=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const btn=(label,act,style='',attrs='')=>`<button class="btn ${style}" data-act="${act}" ${attrs}>${label}</button>`;
const s={root:'tracking',sub:null,tracking:true,gnss:'Fresh',gnssAccuracy:'3.0 m',fixAge:'1 s',online:false,pending:1,acked:0,theme:'day',adaptive:false,reporting:'10',commandTrusted:false,sos:'none',alerts:1,notificationPermission:true,sound:true,party:'Field Team',id:'Party',address:'http://192.168.1.10:8080',emergencyHold:true,dialog:null,remoteRevision:1,physicalTest:false};
const subs={party:{parent:'settings',name:'Party & Command',desc:'Identity, Command address and reporting'},trust:{parent:'settings',name:'Command access',desc:'Enrollment and verified authority'},ready:{parent:'settings',name:'Field readiness',desc:'Device permissions and battery'},policy:{parent:'settings',name:'Tracking policy',desc:'Reporting and local adaptive storage'},emergency:{parent:'settings',name:'Emergency controls',desc:'SOS preferences'},sosSettings:{parent:'settings',name:'SOS history',desc:'Recent SOS events and acknowledgement state'},instructions:{parent:'diagnostics',name:'Command Instructions',desc:'Authenticated execution evidence'},alerts:{parent:'diagnostics',name:'Phone alerts',desc:'Notification and recipient acknowledgements'},storage:{parent:'diagnostics',name:'Saved data & sync',desc:'Durable backlog and history transport'},tools:{parent:'diagnostics',name:'Diagnostic tools',desc:'Recovery, export and physical tests'},physical:{parent:'diagnostics',name:'Physical Button Test',desc:'Foreground-only testing'},gnss:{parent:'diagnostics',name:'GNSS details',desc:'Measurement quality and recent fixes'},connection:{parent:'diagnostics',name:'Command contact',desc:'Network and durable receipt'},notification:{parent:'diagnostics',name:'Tracking notification',desc:'Foreground presentation preview'},sosJournal:{parent:'diagnostics',name:'SOS history',desc:'Local activation and durable acknowledgements'}};
let timer,toastTimer,lastFocus;
function notify(t){const n=$('toast');n.textContent=t+' · simulated';n.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),2700)}
function openDialog(title,sub,body,foot){lastFocus=document.activeElement;s.dialog=title;$('dialogTitle').textContent=title;$('dialogSub').textContent=sub||'';$('dialogBody').innerHTML=body;$('dialogFoot').innerHTML=foot||btn('Done','close-dialog','primary');$('dialogBackdrop').classList.add('open');setTimeout(()=>$('dialogBackdrop').querySelector('button')?.focus(),0)}
function closeDialog(){s.dialog=null;$('dialogBackdrop').classList.remove('open');if(lastFocus?.isConnected)lastFocus.focus()}
function nav(root){s.root=root;s.sub=null;render()}
function sub(key){if(!subs[key])return;s.sub=key;s.root=subs[key].parent;render()}
function back(){s.sub=null;render()}
const row=(title,description,key)=>`<button class="listrow" data-act="sub" data-sub="${key}"><span><b>${title}</b><small>${description}</small></span><span class="chevron">›</span></button>`;
const status=(t,warn=false,danger=false)=>`<span class="status ${warn?'warn':''}${danger?' danger':''}">${t}</span>`;
function render(){document.body.classList.toggle('night',s.theme==='night');$('themeIcon').setAttribute('href',s.theme==='day'?'#i-moon':'#i-sun');$('back').hidden=!s.sub;$('brandIcon').hidden=!!s.sub;$('appTitle').textContent=s.sub?subs[s.sub].name:'GNSS Tracker';$('appSubtitle').textContent=s.sub?subs[s.sub].desc:'Operator device · interactive proposal';document.querySelectorAll('[data-act=nav]').forEach(x=>x.classList.toggle('current',x.dataset.screen===s.root));$('screen').innerHTML=s.sub?renderSub():s.root==='tracking'?renderTracking():s.root==='settings'?renderSettings():renderDiagnostics();$('screen').scrollTop=0;$('sosStatus').textContent=s.sos==='local'?'Locally created · delivery pending':s.sos==='acked'?'Command ACK received':'Hold 1.2 seconds'}
function renderTracking(){return `<h2 class="viewtitle">Tracking</h2><p class="lead">Your phone's collection and delivery status.</p><section class="card hero"><div class="hero-top"><div><b>${s.tracking?'Tracking active':'Tracking stopped'}</b><small>${s.tracking?'GNSS observations saved locally':'No new GNSS collection in progress'}</small></div>${status(s.tracking?'ON':'OFF',!s.tracking)}</div><div class="hero-action">${btn(s.tracking?'Stop tracking':'Start tracking',s.tracking?'request-stop':'request-start',s.tracking?'full secondary':'full primary')}</div></section><section class="card"><div class="cardhead"><b>GNSS position</b>${status(s.tracking?'Fresh':'Stopped',!s.tracking)}</div><div class="metrics"><div class="metric"><strong>${s.tracking?s.gnssAccuracy:'—'}</strong><small>Accuracy</small></div><div class="metric"><strong>${s.tracking?s.fixAge:'—'}</strong><small>Fix age</small></div></div></section><section class="card"><div class="cardhead"><b>Delivery to Command</b>${status(s.online?'Connected':'No contact',!s.online)}</div><div class="metrics"><div class="metric"><strong>${s.pending}</strong><small>Pending locally</small></div><div class="metric"><strong>${s.acked}</strong><small>Durably ACKed</small></div></div><div class="card-foot"><span class="foot-copy">${s.pending?'Observations retained until received':'No pending observations'}</span>${btn('Sync now','sync','small primary',s.pending?'':'disabled')}</div></section><div class="note">Phone tracking, Command contact and SOS confirmation are separate. Configuration and technical tools live in their own destinations.</div>`}
function renderSettings(){return `<h2 class="viewtitle">Settings</h2><p class="lead">Set up the device, reporting and operational readiness.</p><div class="sec-title">Device & Command</div><div class="list">${row('Party & Command','Identity, address and reporting interval','party')}${row('Command access','Enrollment and authenticated contact','trust')}${row('Field readiness','Location, notifications and battery','ready')}${row('Tracking policy','Reporting and adaptive storage','policy')}</div><div class="sec-title">Safety</div><div class="list">${row('Emergency controls','SOS configuration','emergency')}${row('SOS history','Recent SOS events and acknowledgement state','sosSettings')}</div>`}
function renderDiagnostics(){return `<h2 class="viewtitle">Diagnostics</h2><p class="lead">Readiness, evidence and tools for troubleshooting.</p><div class="sec-title">Current device health</div><section class="card"><div class="health"><span class="health-icon">◎</span><div class="health-copy"><b>GNSS</b><small>${s.tracking?'3.0 m accuracy · fresh':'Collection stopped'}</small></div>${status(s.tracking?'Fresh':'Stopped',!s.tracking)}</div><div class="health"><span class="health-icon">⇄</span><div class="health-copy"><b>Command delivery</b><small>${s.pending} pending · ${s.online?'contact confirmed':'no contact'}</small></div>${status(s.online?'Online':'Offline',!s.online)}</div><div class="health"><span class="health-icon">▤</span><div class="health-copy"><b>Local storage</b><small>Durable original observation outbox</small></div>${status('Ready')}</div><div class="health"><span class="health-icon">◇</span><div class="health-copy"><b>Trusted control</b><small>${s.commandTrusted?'Enrolled':'Enrollment required'}</small></div>${status(s.commandTrusted?'Trusted':'Unenrolled',!s.commandTrusted)}</div></section><div class="sec-title">Operational records</div><div class="list">${row('Command Instructions','Requested, applied and unknown outcomes','instructions')}${row('Phone alerts','Output, ACK and alert history','alerts')}${row('Saved data & sync','Backlog, retry and receipts','storage')}${row('SOS history','Local, Command and human ACKs','sosJournal')}</div><div class="sec-title">Troubleshooting</div><div class="list">${row('GNSS details','Accuracy and observation inspection','gnss')}${row('Command contact','Network, receipt and authority','connection')}${row('Diagnostic tools','Export, notification and physical-button tests','tools')}</div>`}
function field(label,id,value,type='text',hint=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${escapeHtml(value)}">${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function settingBlock(title,description,id,checked){return `<div class="switchrow"><div style="min-width:0"><b>${title}</b><small>${description}</small></div><button class="switch ${checked?'on':''}" data-act="${id}" role="switch" aria-checked="${checked}" aria-label="Toggle ${title}"></button></div>`}
function renderSub(){let key=s.sub;switch(key){case'party':return `<section class="card">${field('Party ID','partyId',s.id)}${field('Party name','partyName',s.party)}${field('Command address','addr',s.address)}${field('Reporting interval · seconds','interval',s.reporting,'number')}<div class="row-actions">${btn('Cancel','back','secondary')}${btn('Save settings','save-party','primary')}</div></section>`;
case'trust':return `<section class="card"><div class="note" style="margin-bottom:14px">Matching Wi-Fi or an IP is not proof of trust. Confirm the Command UUID and privately enter your enrollment credential.</div>${field('This phone UUID','phoneUuid','8ab1-0fd2-...', 'text')}${field('Command authority UUID','authorityUuid',s.commandTrusted?'Verified — demo':'Not verified','text')}${field('Enrollment credential','credential',s.commandTrusted?'Already enrolled':'','password','Do not share this credential in exported diagnostics.')}<div class="row-actions">${btn(s.commandTrusted?'Recheck enrollment':'Authorize Command','enroll','primary')}${btn('Enrollment steps','enroll-steps','secondary')}</div>${s.commandTrusted?`<div class="note" style="margin-top:12px">Authenticated contact established in the simulated state.</div>`:''}</section>`;
case'ready':return `<section class="card"><div class="health"><span class="health-icon">◎</span><div class="health-copy"><b>Precise location</b><small>Required for field GNSS</small></div>${status('Allowed')}</div><div class="health"><span class="health-icon">▤</span><div class="health-copy"><b>Notifications</b><small>Foreground tracking and actions</small></div>${status(s.notificationPermission?'Allowed':'Blocked',!s.notificationPermission)}</div><div class="health"><span class="health-icon">◌</span><div class="health-copy"><b>Battery restrictions</b><small>OEM/Doze behavior must be verified on device</small></div>${status('Review',true)}</div><div class="card-action">${btn('Open permission guidance','permission-guide','full')}</div></section>`;
case'policy':return `<section class="card"><div class="field"><label>Reporting interval</label><select id="reporting"><option value="5" ${s.reporting==='5'?'selected':''}>5 seconds</option><option value="10" ${s.reporting==='10'?'selected':''}>10 seconds</option><option value="30" ${s.reporting==='30'?'selected':''}>30 seconds</option><option value="60" ${s.reporting==='60'?'selected':''}>60 seconds</option></select></div>${settingBlock('Adaptive storage','OFF by default. Only original future callbacks are selected; previous evidence stays unchanged.','adaptive',s.adaptive)}<div class="note" style="margin-top:12px">Tracking collection and Sync All Now remain independent of this preference.</div><div class="card-action">${btn('Save policy','save-policy','full primary')}</div></section>`;
case'emergency':return `<section class="card">${settingBlock('Protected SOS hold','Intentional 1.2-second hold, with cancellation before completion.','sos-pref',s.emergencyHold)}<div class="note" style="margin-top:12px">SOS local creation, Command receipt and operator acknowledgement remain separate facts. Physical button testing is in Diagnostics, not Settings.</div>${btn('View SOS history','sos-history','full secondary','style="margin-top:12px"')}</section>`;
case'appearance':return `<section class="card"><div class="switchrow"><div><b>${s.theme==='day'?'Day appearance':'Night appearance'}</b><small>Use the icon-only appearance button in the app bar, or switch here.</small></div>${btn('Switch','theme','secondary')}</div></section>`;
case'instructions':return `<section class="card"><div class="health"><div class="health-copy"><b>Sync All Now</b><small>Received · 12:09 PM</small></div>${status('Applied')}</div><div class="health"><div class="health-copy"><b>Reporting interval</b><small>12:11 PM · result unknown after restart</small></div>${status('Unknown',true)}</div><div class="card-action">${btn('Filter history','filter-instructions','full secondary')}${btn('Export sanitized journal','export','full secondary','style="margin-top:8px"')}</div></section>`;
case'alerts':return `<section class="card"><div class="health"><div class="health-copy"><b>Urgent alert</b><small>Output attempted; hearing/vibration unverified</small></div>${status(s.alerts?'Active':'ACKed',!!s.alerts)}</div><div class="card-action">${btn('View alert & acknowledge','alert-preview','full primary',s.alerts?'':'disabled')}${btn('Export alert journal','export','full secondary','style="margin-top:8px"')}</div></section>`;
case'storage':return `<section class="card"><div class="metrics"><div class="metric"><strong>${s.pending}</strong><small>Pending observations</small></div><div class="metric"><strong>${s.acked}</strong><small>Command ACKed</small></div></div><div class="card-action">${btn('Sync All Now','sync','full primary',s.pending?'':'disabled')}${btn('Export transfer evidence','export','full secondary','style="margin-top:8px"')}</div></section><div class="note">No unnecessary Pause History Sync control.</div>`;
case'tools':return `<div class="list">${row('Physical Button Test','Foreground volume-key diagnostic only','physical')}</div><div class="sec-title">Maintenance</div>${btn('Export diagnostic ZIP','export','full secondary')}`;
case'physical':return `<section class="card"><div class="note">This is a foreground-only diagnostic. Standard Android does not guarantee global volume-button SOS while locked.</div><div class="row-actions">${btn('Test Volume +','volume-plus','secondary')}${btn('Test Volume −','volume-minus','secondary')}</div><div class="card-action"><span id="physicalResult" class="status">Awaiting test</span></div></section>`;
case'gnss':return `<section class="card"><div class="cardhead"><b>Latest original location</b>${status(s.tracking?'Fresh':'Stopped',!s.tracking)}</div><div class="health"><div class="health-copy"><b>Accuracy</b><small>Reported horizontal accuracy</small></div><b>${s.gnssAccuracy}</b></div><div class="health"><div class="health-copy"><b>Fix age</b><small>Time since actual GNSS capture</small></div><b>${s.fixAge}</b></div><div class="note">Quality filters and derived distance are Command-owned, not invented here.</div></section>`;
case'connection':return `<section class="card"><div class="health"><div class="health-copy"><b>Command transport</b><small>Last durable receipt</small></div>${status(s.online?'Contact':'No contact',!s.online)}</div><div class="health"><div class="health-copy"><b>Authenticated control</b><small>Separate proof from GNSS ACK</small></div>${status(s.commandTrusted?'Trusted':'Unverified',!s.commandTrusted)}</div><div class="note" style="margin-top:12px">Contact state and trust state are shown here as diagnostics, without redirecting you into Command access.</div></section>`;
case'notification':return `<section class="card"><div class="cardhead"><b>Tracking active</b>${status('Foreground')}</div><p class="lead" style="margin:0">Collecting original GNSS observations and keeping transfer evidence locally.</p><div class="note" style="margin-top:12px">This preview shows information hierarchy only. Action buttons are intentionally omitted here.</div></section>`;
case'sosSettings':return `<section class="card"><div class="health"><div class="health-copy"><b>Most recent SOS</b><small>${s.sos==='none'?'No new local trigger in this preview':s.sos==='local'?'Created locally · pending transport':'Command durably received'}</small></div>${status(s.sos==='none'?'Ready':s.sos==='local'?'Pending':'Received',s.sos==='local')}</div><div class="note">This SOS history lives inside Settings so operators do not jump tabs while adjusting emergency behavior.</div></section>`;
case'sosJournal':return `<section class="card"><div class="health"><div class="health-copy"><b>Most recent SOS</b><small>${s.sos==='none'?'No new local trigger in this preview':s.sos==='local'?'Created locally · pending transport':'Command durably received'}</small></div>${status(s.sos==='none'?'Ready':s.sos==='local'?'Pending':'Received',s.sos==='local')}</div><div class="note">Command human acknowledgement is an independent operator action.</div></section>`;
}return '<p class="note">Unsupported destination</p>'}
function simulateSync(){s.online=true;s.acked+=s.pending;s.pending=0;if(s.sos==='local')s.sos='acked';notify('Transfer and Command durable receipt');render()}
function stopConfirm(){openDialog('Stop tracking?','This ends new GNSS collection, not the retained outbox.',`<p class="note">Pending observations remain stored. SOS and local evidence are independent of this Tracking action.</p>`,btn('Cancel','close-dialog','secondary')+btn('Stop tracking','confirm-stop','danger'))}
function enrollSteps(){openDialog('Authorize Command','Private, explicit enrollment — not automatic pairing.',`<div class="note">1. On Command, open Phone controls.<p>2. Verify this phone UUID and Command UUID.</p>3. Privately transfer the per-phone credential into Command access.<p>4. Confirm fresh authenticated contact.</p></div>`,btn('Done','close-dialog','primary'))}
function alertPreview(){openDialog('Urgent phone alert','Recipient acknowledgement and sound/vibration are separate.',`<section class="card"><div class="cardhead"><b>Urgent attention</b>${status('Active',false,true)}</div><p class="lead">Output requested. Actual sound/vibration cannot be proven from software acknowledgement alone.</p></section>`,btn('Stop output','stop-alert','secondary')+btn('Acknowledge','ack-alert','primary'))}
function event(e){const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;switch(a){case'nav':nav(b.dataset.screen);break;case'sub':sub(b.dataset.sub);break;case'back':back();break;case'theme':s.theme=s.theme==='day'?'night':'day';render();break;case'request-stop':stopConfirm();break;case'request-start':s.tracking=true;render();notify('Tracking started');break;case'confirm-stop':s.tracking=false;closeDialog();render();notify('Tracking stopped');break;case'sync':simulateSync();break;case'show-gnss':sub('gnss');break;case'save-party':{const name=$('partyName').value.trim(),addr=$('addr').value.trim(),id=$('partyId').value.trim(),interval=$('interval').value;if(!name||!id||!/^https?:\/\//.test(addr)||Number(interval)<1){notify('Check required fields and valid address');break}s.party=name;s.id=id;s.address=addr;s.reporting=interval;back();notify('Local settings saved');break}case'command-trust':sub('trust');break;case'enroll':s.commandTrusted=true;s.online=true;render();notify('Authenticated contact simulated');break;case'enroll-steps':enrollSteps();break;case'permission-guide':openDialog('Field readiness','Open the relevant Android system settings on a real device.',`<div class="note">Enable precise location, notifications and appropriate background permissions. OEM battery behavior needs physical verification.</div>`,btn('Close','close-dialog'));break;case'adaptive':s.adaptive=!s.adaptive;render();notify('Adaptive storage '+(s.adaptive?'enabled':'disabled'));break;case'save-policy':s.reporting=$('reporting').value;notify('Policy saved');render();break;case'sos-pref':s.emergencyHold=!s.emergencyHold;render();notify('SOS hold preference updated');break;case'sos-history':sub('sosSettings');break;case'filter-instructions':openDialog('Instruction filter','Select relevant outcomes.',`<label class="switchrow"><input type="checkbox" checked> <span>Applied</span></label><label class="switchrow"><input type="checkbox" checked> <span>Unknown</span></label><label class="switchrow"><input type="checkbox"> <span>Rejected / blocked</span></label>`,btn('Apply filters','close-dialog','primary'));break;case'export':notify('Sanitized diagnostic export');break;case'alert-preview':alertPreview();break;case'ack-alert':s.alerts=0;closeDialog();render();notify('Recipient acknowledgement stored');break;case'stop-alert':s.alerts=0;closeDialog();render();notify('Local output stopped');break;case'volume-plus':case'volume-minus':$('physicalResult').textContent=a==='volume-plus'?'Volume + observed':'Volume − observed';notify('Physical-key diagnostic event');break;case'close-dialog':closeDialog();break;default:notify('Design interaction') }}
document.addEventListener('click',event);$('dialogBackdrop').addEventListener('click',e=>{if(e.target===$('dialogBackdrop'))closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.dialog)closeDialog();else if(s.sub)back()}});
const sosBtn=$('sosBtn');let sosTimer,sosStart=0,sosCompleted=false;function holdStart(e){if(!s.emergencyHold)return;if(e.button!==undefined&&e.button!==0)return;sosCompleted=false;sosStart=Date.now();$('sosText').textContent='Keep holding…';clearInterval(sosTimer);sosTimer=setInterval(()=>{const percent=Math.min(100,(Date.now()-sosStart)/12);$('sosProgress').style.width=percent+'%';if(percent>=100){clearInterval(sosTimer);sosCompleted=true;s.sos='local';s.pending++;$('sosText').textContent='SOS created locally';render();notify('SOS locally persisted — network not required')}},40)}function holdEnd(){clearInterval(sosTimer);if(!sosCompleted)$('sosText').textContent='Hold to activate SOS';setTimeout(()=>$('sosProgress').style.width='0%',sosCompleted?240:0)}sosBtn.addEventListener('pointerdown',holdStart);sosBtn.addEventListener('pointerup',holdEnd);sosBtn.addEventListener('pointercancel',holdEnd);sosBtn.addEventListener('pointerleave',holdEnd);
render();
</script></body></html>
