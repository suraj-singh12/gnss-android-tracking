<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v3 · GNSS Tracker Android — proposed UI prototype (b59b083)</title>
<style>
:root{
  --fs:1;
  --page:#E7ECEC;--page-ink:#23363C;--page-muted:#61747A;--page-card:#fff;
}
body{margin:0;font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--page);color:var(--page-ink)}
.topbar{position:sticky;top:0;z-index:20;background:#23363C;color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.topbar b{font-size:14px}
.topbar .tag{background:#F7E9EC;color:#833C4A;font-weight:700;font-size:11px;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.topbar .meta{font-size:12px;opacity:.75}
.ctl{display:flex;gap:6px;align-items:center;font-size:12px}
.ctl span{opacity:.75}
.ctl button{background:#36494E;color:#fff;border:0;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer}
.ctl button.on{background:#8CDABF;color:#10302A;font-weight:700}
.wrap{display:grid;grid-template-columns:230px 410px minmax(300px,1fr);gap:22px;padding:20px;align-items:start}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}.nav{order:3}}
.nav{background:var(--page-card);border-radius:14px;padding:10px;position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto}
.nav h4{margin:12px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted)}
.nav a{display:block;padding:7px 10px;border-radius:8px;font-size:13px;color:inherit;text-decoration:none;cursor:pointer}
.nav a.sub{padding-left:22px}
.nav a.active{background:#E5F3ED;color:#176D60;font-weight:700}
.side{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--page-card);border-radius:14px;padding:16px 18px}
.panel h3{margin:0 0 8px;font-size:15px}
.panel ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
.panel li{margin-bottom:6px}
.panel .why{color:var(--page-muted)}
.cur{display:flex;gap:14px;flex-wrap:wrap}
.cur figure{margin:0}
.cur img{width:220px;border-radius:14px;border:1px solid #DCE6E6;display:block}
.cur figcaption{font-size:11px;color:var(--page-muted);margin-top:4px}
.none{font-size:13px;color:var(--page-muted)}
.lbl{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.lbl.bug{background:#F7E9EC;color:#833C4A}.lbl.ux{background:#FDF0DC;color:#936020}.lbl.style{background:#E5F3ED;color:#176D60}

/* ---------- phone ---------- */
.phone{width:390px;height:844px;border-radius:44px;background:#0d1417;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:sticky;top:64px}
.screen{
  --bg:#F3F6F6;--surface:#FFFFFF;--ink:#23363C;--muted:#61747A;--line:#DCE6E6;--fill:#EAF0F0;
  --accent:#176D60;--action:#176D60;--on-action:#fff;--danger:#833C4A;--warn:#936020;
  --pos-s:#E5F3ED;--warn-s:#FDF0DC;--bad-s:#F7E9EC;--neutral-s:#EAF0F0;--em:#833C4A;--em-s:#F7E9EC;--em-fill:#5E2633;
  width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;position:relative}
.screen.night{--bg:#111C22;--surface:#1C2C33;--ink:#E6EEF0;--muted:#AEC0C5;--line:#36494E;--fill:#25373E;
  --accent:#8CDABF;--danger:#E9A6B2;--warn:#EFD09C;--pos-s:#1F3A33;--warn-s:#3A3122;--bad-s:#412A32;--neutral-s:#2A3B42;--em-s:#412A32;--em-fill:#5E2633}
.sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 18px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.f{font-size:calc(var(--fs) * 15px)}
.navbar{display:flex;align-items:center;gap:6px;min-height:44px;margin:0 -8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:calc(var(--fs)*15px);background:none;border:0;padding:8px;cursor:pointer;min-height:44px}
.back svg{width:22px;height:22px}
.navbar .spacer{flex:1}
.navbtn{color:var(--accent);background:none;border:0;font-size:calc(var(--fs)*15px);font-weight:600;padding:8px 10px;min-height:44px;cursor:pointer}
.navbtn:disabled{color:var(--muted);opacity:.55;cursor:default}
.ttl{font-size:calc(var(--fs)*30px);font-weight:700;letter-spacing:-.01em;margin:6px 0 2px;line-height:1.15}
.ttl.sm{font-size:calc(var(--fs)*24px)}
.lede{font-size:calc(var(--fs)*14px);color:var(--muted);margin:0;line-height:1.4}
.content>.group,.content>.hero,.content>.empty,.content>.metrics,.content>.callout,.content>.actions,.content>.chips{margin-top:20px}
.content>.gh+.group,.content>.gh+.hero,.content>.gh+.empty{margin-top:0}
.content>.ttl+.group,.content>.ttl+.hero,.content>.ttl+.callout,.content>.ttl+.empty,.content>.ttl+.metrics{margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.gh{font-size:calc(var(--fs)*12.5px);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:20px 16px 6px;font-weight:600}
.gf{font-size:calc(var(--fs)*12.5px);color:var(--muted);margin:6px 16px 0;line-height:1.4}
.group{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px 10px 16px;position:relative;cursor:default;box-sizing:border-box}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row.ic+.row.ic::before,.row+.row.ic::before{left:56px}
.row.tap{cursor:pointer}.row.tap:active{background:var(--fill)}
.row .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--neutral-s);color:var(--accent)}
.row .ico svg{width:17px;height:17px}
.row .tx{flex:1;min-width:0}
.row .t{font-size:calc(var(--fs)*15.5px);line-height:1.25}
.row .s{font-size:calc(var(--fs)*13px);color:var(--muted);margin-top:2px;line-height:1.3}
.row .v{font-size:calc(var(--fs)*15px);color:var(--muted);text-align:right;flex:none;max-width:52%}
.chev{width:9px;height:14px;flex:none;color:var(--muted);opacity:.7}
.steps .mono{font-size:calc(var(--fs)*11.5px)}
.row.destr .t{color:var(--danger)}
.row.act .t{color:var(--accent)}
.row.dis{opacity:.45;cursor:default}
.mono{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:calc(var(--fs)*12.5px);letter-spacing:-.01em;word-break:break-all}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:calc(var(--fs)*12.5px);font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--pos-s);color:var(--accent)}.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.bad{background:var(--bad-s);color:var(--danger)}.pill.neu{background:var(--neutral-s);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.hero{background:var(--surface);border-radius:18px;padding:18px 16px 16px}
.hero .state{display:flex;align-items:center;gap:9px;font-size:calc(var(--fs)*22px);font-weight:700;line-height:1.2}
.hero .state .dot{width:11px;height:11px}
.hero .desc{font-size:calc(var(--fs)*14px);color:var(--muted);margin:6px 0 14px;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:14px;border:0;font-size:calc(var(--fs)*16px);font-weight:600;cursor:pointer;font-family:inherit;padding:8px 14px;box-sizing:border-box;text-align:center}
.btn.pri{background:var(--action);color:var(--on-action)}
.btn.sec{background:var(--neutral-s);color:var(--accent)}
.btn.dan{background:var(--bad-s);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn+.btn{margin-top:10px}
.callout{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.callout.warn{background:var(--warn-s)}.callout.bad{background:var(--bad-s)}.callout.ok{background:var(--pos-s)}
.callout .ct{font-weight:600;font-size:calc(var(--fs)*14.5px)}
.callout .cs{font-size:calc(var(--fs)*13px);color:var(--muted);margin-top:2px;line-height:1.35}
.callout a{color:var(--accent);font-weight:600;cursor:pointer;font-size:calc(var(--fs)*13.5px);display:inline-block;margin-top:6px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border-radius:14px;overflow:hidden}
.metric{padding:12px 16px}
.metric+.metric{border-left:1px solid var(--line)}
.metric .n{font-size:calc(var(--fs)*26px);font-weight:700;font-variant-numeric:tabular-nums}
.metric .l{font-size:calc(var(--fs)*12.5px);color:var(--muted)}
.field{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 16px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.field label{font-size:calc(var(--fs)*15.5px);flex:none;width:38%}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:calc(var(--fs)*15.5px);text-align:right;outline:none;padding:8px 0}
.field input::placeholder{color:var(--muted);opacity:.55;font-style:italic}
.field.stack{flex-direction:column;align-items:stretch;gap:2px;padding:10px 16px}
.field.stack label{width:auto;font-size:calc(var(--fs)*13px);color:var(--muted)}
.field.stack input,.field.stack textarea{text-align:left}
textarea{border:0;background:transparent;color:var(--ink);font-family:"Roboto Mono",ui-monospace,monospace;font-size:calc(var(--fs)*13px);resize:none;outline:none;min-height:64px}
.seg{display:flex;background:var(--neutral-s);border-radius:10px;padding:2px;gap:2px;margin:0 16px 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:calc(var(--fs)*13.5px);padding:7px 0;border-radius:8px;cursor:pointer;min-height:34px}
.seg button.on{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.screen.night .sw:not(.on){background:#4C6168}
.sw.on{background:var(--action)}.sw.on::after{left:23px}
.empty{background:var(--surface);border-radius:14px;padding:28px 20px;text-align:center}
.empty svg{width:34px;height:34px;color:var(--muted);opacity:.7}
.empty .et{font-weight:600;font-size:calc(var(--fs)*16px);margin-top:8px}
.empty .es{font-size:calc(var(--fs)*13.5px);color:var(--muted);margin-top:4px;line-height:1.4}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;padding:10px 16px;align-items:flex-start;position:relative}
.steps li+li::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--line)}
.steps .num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--neutral-s);color:var(--muted)}
.steps .num.done{background:var(--action);color:#fff}
.steps .num.now{background:var(--warn-s);color:var(--warn)}
.steps .st{font-size:calc(var(--fs)*15px)}
.steps .ss{font-size:calc(var(--fs)*12.5px);color:var(--muted);margin-top:2px}
.compare{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 16px}
.compare .k{font-size:calc(var(--fs)*12.5px);color:var(--muted)}
.compare .match{color:var(--accent);font-weight:600;font-size:calc(var(--fs)*13.5px)}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;flex:none;font-style:italic;font-family:Georgia,serif}
.disclose{font-size:calc(var(--fs)*13px);color:var(--muted);padding:0 16px 12px;line-height:1.4;display:none}
.disclose.open{display:block}
.keylog{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);padding:0 16px 12px}
.progress{height:6px;border-radius:99px;background:var(--neutral-s);overflow:hidden;margin:4px 16px 12px}
.progress i{display:block;height:100%;background:var(--warn);border-radius:99px}
/* SOS dock */
.dock{flex:none;padding:8px 12px 6px;background:var(--bg)}
.sos{position:relative;overflow:hidden;width:100%;min-height:48px;border-radius:14px;border:0;background:var(--em);color:#fff;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 14px;user-select:none;-webkit-user-select:none;touch-action:none}
.sos .fill{position:absolute;inset:0;width:0;background:var(--em-fill)}
.sos .lab{position:relative;font-weight:700;font-size:calc(var(--fs)*15.5px)}
.sos .cap{position:relative;font-size:calc(var(--fs)*12px);opacity:.85}
.sos.lg{flex-direction:column;gap:0}
.sosactive{background:var(--em-s);border-radius:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.sosactive .t{font-weight:700;color:var(--danger);font-size:calc(var(--fs)*14.5px)}
.sosactive .s{font-size:calc(var(--fs)*12.5px);color:var(--muted)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(200,80,100,.6)}100%{box-shadow:0 0 0 10px rgba(200,80,100,0)}}
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px 14px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:calc(var(--fs)*11.5px);color:var(--muted);background:none;border:0;padding:6px 0;cursor:pointer;position:relative;font-family:inherit}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent);font-weight:700}
.tab .badge{position:absolute;top:3px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(20,30,34,.92);color:#fff;font-size:13px;padding:9px 14px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:5}
.toast.show{opacity:1}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;z-index:6;align-items:flex-end}
.sheet-bg.show{display:flex}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:18px 18px 26px;box-sizing:border-box}
.sheet h5{margin:0 0 6px;font-size:calc(var(--fs)*18px)}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:calc(var(--fs)*14px);line-height:1.4}
.ts{font-size:calc(var(--fs)*12px);color:var(--muted);font-variant-numeric:tabular-nums}
.group,.hero,.metrics,.empty,.tile,.card{box-shadow:0 1px 2px rgba(16,40,40,.05),0 6px 18px rgba(16,40,40,.05)}
.screen.night .group,.screen.night .hero,.screen.night .metrics,.screen.night .empty,.screen.night .tile,.screen.night .card{box-shadow:none}
.group,.metrics,.empty{border-radius:18px}
.ctx{font-size:calc(var(--fs)*13.5px);color:var(--muted);margin:0;display:flex;gap:6px;align-items:center}
.hero{border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.9;pointer-events:none}
.hero.ok::before{background:linear-gradient(160deg,var(--pos-s) 0%,transparent 62%)}
.hero.warn::before{background:linear-gradient(160deg,var(--warn-s) 0%,transparent 62%)}
.hero.neu::before{background:linear-gradient(160deg,var(--neutral-s) 0%,transparent 62%)}
.hero>*{position:relative}
.hhead{display:flex;gap:14px;align-items:center}
.orb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.orb svg{width:26px;height:26px}
.orb.ok{background:var(--action);color:#fff}.orb.warn{background:var(--warn);color:#fff}.orb.neu{background:var(--neutral-s);color:var(--muted)}
.screen.night .orb.warn{color:#3A3122}
.orb.ok::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--action);opacity:0;animation:ring 2.2s infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.hstate{font-size:calc(var(--fs)*21px);font-weight:700;line-height:1.2}
.hdesc{font-size:calc(var(--fs)*13.5px);color:var(--muted);margin-top:3px;line-height:1.35}
.pipe{display:flex;align-items:flex-start;margin:18px 2px 16px}
.node{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;flex:none;text-align:center}
.node i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--neutral-s);color:var(--muted)}
.node i svg{width:18px;height:18px}
.node.ok i{background:var(--pos-s);color:var(--accent)}.node.warn i{background:var(--warn-s);color:var(--warn)}
.node b{font-size:calc(var(--fs)*12px);font-weight:600}
.node small{font-size:calc(var(--fs)*11px);color:var(--muted);line-height:1.2}
.link{flex:1;height:0;border-top:2.5px solid var(--line);margin-top:17px;border-radius:2px}
.link.ok{border-color:var(--accent)}.link.warn{border-top-style:dashed;border-color:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tl{font-size:calc(var(--fs)*12px);color:var(--muted);display:flex;gap:6px;align-items:center}
.tile .tl svg{width:14px;height:14px}
.tile .tn{font-size:calc(var(--fs)*22px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .tn small{font-size:calc(var(--fs)*13px);font-weight:500;color:var(--muted);margin-left:2px}
.content>.tiles,.content>.segtop,.content>.card{margin-top:20px}
.content>.ttl+.tiles,.content>.ctx+.hero,.content>.ctx+.callout,.content>.lede+.group{margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-size:calc(var(--fs)*13.5px);font-weight:600;cursor:pointer;background:var(--warn-s);color:var(--warn);min-height:36px}
.segtop{display:flex;background:var(--neutral-s);border-radius:12px;padding:3px;gap:2px;position:sticky;top:0;z-index:2}
.segtop button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:calc(var(--fs)*14px);padding:8px 0;border-radius:10px;cursor:pointer;min-height:36px}
.segtop button.on{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips button{border:0;border-radius:99px;padding:7px 13px;font:inherit;font-size:calc(var(--fs)*13px);background:var(--neutral-s);color:var(--muted);cursor:pointer;min-height:34px}
.chips button.on{background:var(--action);color:#fff;font-weight:600}
.feed .row{align-items:flex-start}
.feed .ico{margin-top:2px}
.seg{margin:0}
.segwrap{padding:10px 16px 12px}
.savebar{position:sticky;bottom:0;margin:20px -16px -18px;padding:10px 16px 14px;background:var(--bg);display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);z-index:3}
.savebar span{flex:1;font-size:calc(var(--fs)*13px);color:var(--muted)}
.savebar .btn{width:auto;min-height:40px;padding:6px 16px;font-size:calc(var(--fs)*14.5px)}
.savebar .btn+.btn{margin-top:0}
.sheet .opt{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;font-size:calc(var(--fs)*15px)}
.sheet .opt .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--neutral-s);color:var(--accent)}
.sheet .opt .ico svg{width:17px;height:17px}
.sheet .opt small{display:block;color:var(--muted);font-size:calc(var(--fs)*12.5px)}
.status-card{display:flex;gap:14px;align-items:center;padding:16px}
.sos{background:linear-gradient(180deg,#93475A,#7A3343)}

R.tracking={tab:'tracking',title:'Tracking',cur:['day-1.0-tracking','night-1.0-tracking','day-1.5-tracking'],

render(){

 else card=`<div class="hero"><div class="state">${dot('accent')}Tracking</div><div class="desc">Reporting every ${S.saved.interval} s</div>${btn('sec stop','stop','Stop Tracking')}</div>`;

  <li><span class="num done">✓</span><div><div class="st">Delivered to Command</div><div class="ss">14:31:06</div></div></li>

 const att=!configured()?row({ico:'server',ist:ist.warn,t:'Add a Command address',s:'Tracking works offline; nothing can be delivered yet.',gotab:'settings',go:'party'})

 const f=st==='fresh';
 const gnss=[row({t:'Position fix',v:f?'Stopped':pill('ok','Fresh')}),row({t:'Accuracy',v:f?'—':'±3.2 m'}),row({t:'Fix age',v:f?'—':'4 s'}),row({t:'Battery',v:'82%'})];

 const del=[row({t:'Command',v:cmd}),row({t:'Waiting on phone',v:st==='offline'?'<b style="color:var(--ink)">342</b>':'0'}),row({t:'Delivered to Command',v:f?'0':st==='offline'?'11,816':'12,158'}),row({t:'Last Command ACK',v:f?'—':st==='offline'?'14:02':'12 s ago'})];

  +group(gnss,'GNSS')+`<div class="gh">Delivery to Command</div><div class="group">${del.join('')}${st==='offline'?`<div style="padding:0 16px 14px">${btn('sec','sync','Sync now')}</div>`:''}</div><div class="gf">Delivered means Command stored the observation and acknowledged it. Saved data stays on this phone until then.</div>`;

 <div class="chips">${kinds.map(k=>`<button class="${S.filter===k?'on':''}" data-filter="${k}">${k}</button>`).join('')}<button data-fn="filters">Filters${nf?' · '+nf+' off':''}</button></div>`;
 if(!items.length) return top+`<div class="empty">${ICON.inbox}<div class="et">${FEED().length?'No matches':'No activity yet'}</div><div class="es">${FEED().length?'Change search or filters.':'Instructions, phone alerts and SOS events from Command appear here, newest first.'}</div></div>`;
 return top+`<div class="gh">Today</div><div class="group feed">${items.map(i=>row({ico:i.ic,ist:ist[i.c],t:i.t,s:i.s,fn:'det:'+i.id,chev:1})).join('')}</div>
 <div class="actions">${btn('sec','older','Show older')}</div><div class="gf">Open an item for its full record and export.</div>`;}
function tools(){return `<div class="gh">Physical-key test</div><div class="group">${row({t:S.ptest?'Listening':'Not running',s:S.ptest?'Press volume keys (↑ ↓ on keyboard). SOS shortcut is paused while listening.':'Checks that volume keys reach the app.',v:mini('ptest',S.ptest?'Stop test':'Start test',S.ptest?'sec':'pri')})}
 ${S.keys.length?S.keys.map(k=>row({t:k})).join(''):`<div style="padding:0 16px 14px;color:var(--muted);font-size:calc(var(--fs)*13px)">No detected key events</div>`}
 <div style="padding:0 16px 14px;display:flex;gap:10px">${btn('sec','clearkeys','Clear results',!S.keys.length)}${btn('sec','expkeys','Export test results',!S.keys.length)}</div></div>`
 +group([row({ico:'share',ist:ist.ok,t:'Diagnostic export',s:'Sanitized ZIP of logs and evidence. Tracking continues.',fn:'export',chev:1}),row({ico:'doc',ist:ist.neu,t:'Advanced logs',s:'Technical device evidence',go:'logs'})],'Export & logs');}
R.logs={tab:'diagnostics',title:'Advanced logs',back:'Diagnostics',cur:['day-1.0-diagnostics-bottom'],curNote:'Reconstructed from source; retained secondary destination.',
notes:[['ux','Kept as its own page (retained destination), one tap from Tools.','Technical detail stays out of the main flow but is not removed.']],
render(){return title('Advanced logs','','Diagnostics')+group([row({t:'Sender',s:'Last attempt 14:02 · connection refused'}),row({t:'Retained incidents',v:on()?'3':'0'}),row({t:'Readiness snapshot',s:'Background activity limited'}),row({t:'Security events',v:on()?'12':'0'})],'Technical','Sample values.');}};
const fact=(k,v)=>row({t:k,v});
const DETAIL={
 i1:()=>['Set interval to 10 s',[fact('Received','13:58:02'),fact('Verification','Authenticated'),fact('Execution','Attempt recorded'),fact('Result ACK','Confirmed'),fact('Authority','c7a1…9f20')],['expj','Export journal']],
 i2:()=>['Adaptive storage on',[fact('Received','13:40:11'),fact('Verification','Authenticated'),fact('Execution','Blocked'),fact('Reason','Contact older than 30 s'),fact('Result ACK','Confirmed')],['expj','Export journal']],
 i3:()=>['Sync now',[fact('Received','12:02:40'),fact('Verification','Authenticated'),fact('Execution','Unconfirmed'),fact('Result ACK','Pending')],['expj','Export journal']],
 a1:()=>['Phone alert',[fact('Message','“Regroup at checkpoint B”'),fact('Output',S.alertAck?'Stopped':'Sounding'),fact('Recipient ACK',S.alertAck?'14:06':'Pending'),fact('Command custody',S.alertAck?'Confirmed':'Unconfirmed')],S.alertAck?['expa','Export alert journal']:['ack','Acknowledge / Stop Alert'],!S.alertAck],
 s1:()=>['SOS event',[fact('Created','14:31:05'),fact('Fix age','4 s'),fact('Saved on phone','14:31:05'),fact('Message ACK','14:31:06'),fact('Operator ACK','View Command')],['expev','Export evidence']]};
/* ---------------- shell ---------------- */
const MAP=[['Tracking',[['tracking','Tracking']]],
 ['Settings',[['settings','Settings'],['party','Party & Command',1],['access','Command access',1],['trk','Tracking policy',1],['ready','Field readiness',1],['emergency','Emergency',1],['appearance','Appearance',1]]],
 ['Diagnostics',[['diagnostics@health','Health'],['diagnostics@activity','Activity'],['diagnostics@tools','Tools'],['logs','Advanced logs',1]]]];
const FLOW=`<table class="ft"><tr><th>Area</th><th>Current (b59b083)</th><th>v3</th></tr>
<tr><td>Settings</td><td>6 rows → 9 pages, up to 4 deep</td><td>6 rows → 6 pages, 1 deep</td></tr>
<tr><td>Command access</td><td>Access › Review › Manage › Evidence</td><td>1 page + review sheet</td></tr>
<tr><td>Diagnostics</td><td>6 rows → 9 pages, up to 3 deep</td><td>3 segments + Advanced logs; records open as sheets</td></tr></table>
<p style="font-size:12.5px;color:var(--page-muted);margin:8px 0 0">All 60 preserved controls/values in docs/ui-preservation-matrix.md are present. One needs approval: #05 global Day/Night icon → Settings › Appearance.</p>`;
const curId=()=>S.page[S.tab];
function render(top,anchor){
 const sc=$('#screen'); sc.classList.toggle('night',S.theme==='night'); sc.style.setProperty('--fs',S.fs); sc.classList.toggle('lg',S.fs>=1.3);
 const id=curId(), r=R[id], c=$('#content'), y=c.scrollTop;
 c.innerHTML=r.render(); c.scrollTop=top?0:y;
 if(anchor){const a=document.getElementById(anchor); if(a) c.scrollTop=a.offsetTop-8;}
 $('#dock').innerHTML=S.state==='sos'
  ?`<div class="sosactive" data-gotab="tracking" role="button"><span class="pulse"></span><div style="flex:1"><div class="t">SOS active</div><div class="s">Delivered · waiting for operator ACK</div></div>${ICON.chev}</div>`
  :`<button class="sos ${S.fs>=1.3?'lg':''}" id="sosbtn" aria-label="Emergency SOS. Hold for 1.2 seconds. Release early to cancel."><span class="fill" id="sosfill"></span><span class="lab">Hold for SOS</span><span class="cap">1.2 s · release to cancel</span></button>`;
 const att=S.state==='offline'||S.state==='sos';
 $('#tabs').innerHTML=[['tracking','Tracking'],['settings','Settings'],['diagnostics','Diagnostics']].map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}" aria-label="${l}">${ICON[k]}${k==='diagnostics'&&att?'<span class="badge"></span>':''}<span>${l}</span></button>`).join('');
 $('#pflow').innerHTML=FLOW;
 $('#ptitle').textContent=(r.back?r.back+' › ':'')+r.title+(id==='diagnostics'?' › '+S.dseg[0].toUpperCase()+S.dseg.slice(1):'')+' — what changes and why';
 $('#pnotes').innerHTML='<ul>'+r.notes.map(([k,a,b])=>`<li><span class="lbl ${k}">${k==='bug'?'FIX':k==='ux'?'UX':'STYLE'}</span>${a} <span class="why">${b}</span></li>`).join('')+'</ul>';
 $('#pcur').innerHTML=(r.curNote?`<p class="none">${r.curNote}</p>`:'')+r.cur.map(n=>`<figure><img src="${IMG[n]}" alt="current ${n}"><figcaption>${n.replace('day-1.0-','Day 1.0× · ').replace('night-1.0-','Night 1.0× · ').replace('day-1.5-','Day 1.5× · ')}</figcaption></figure>`).join('');
 const key=id==='diagnostics'?'diagnostics@'+S.dseg:id;
 $('#nav').innerHTML=MAP.map(([h,items])=>`<h4>${h}</h4>`+items.map(([k,l,d])=>`<a class="${d?'sub':''} ${k===key?'active':''}" data-nav="${k}">${l}</a>`).join('')).join('');
 document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('on',b.dataset.state===S.state));
 document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===S.theme));
 document.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('on',+b.dataset.fs===S.fs));
 bindSos();
}
function nav(k){ let [id,anc]=k.split('#'); let seg; [id,seg]=id.split('@'); S.tab=R[id].tab; S.page[S.tab]=id; if(seg) S.dseg=seg; render(true,anc); }
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1800);}
function closeSheet(){$('#sheetbg').classList.remove('show');}
function sheet(t,msg,ok,danger,fn,extra){
 $('#sheet').innerHTML=`<h5>${t}</h5>${msg?`<p>${msg}</p>`:''}${extra||''}${ok?`<button class="btn ${danger?'dan':'pri'}" id="sok">${ok}</button>`:''}<button class="btn sec" id="scancel">Cancel</button>`;
 $('#sheetbg').classList.add('show'); if($('#sok')) $('#sok').onclick=()=>{closeSheet();fn&&fn();}; $('#scancel').onclick=closeSheet; ($('#sok')||$('#scancel')).focus();
}
function bindSos(){
 const b=$('#sosbtn'); if(!b) return; const f=$('#sosfill'); let t0=0,raf=0,done=false;
 const tick=()=>{const p=Math.min(1,(performance.now()-t0)/1200); f.style.width=(p*100)+'%'; if(p>=1){done=true;stop(true);} else raf=requestAnimationFrame(tick);};
 const stop=ok=>{cancelAnimationFrame(raf); if(ok===true){setState('sos');S.tab='tracking';render(true);toast('SOS raised · saved on phone');} else if(!done&&t0){f.style.width='0';toast('Released early — SOS not sent');} t0=0;};
 b.addEventListener('pointerdown',e=>{e.preventDefault();done=false;t0=performance.now();raf=requestAnimationFrame(tick);});
 b.addEventListener('pointerup',()=>stop()); b.addEventListener('pointerleave',()=>{if(t0)stop();});
}
function setState(st){S.state=st; if(st!=='fresh'){if(!S.saved.addr){S.saved={...DEMO};}} else {S.saved={id:'',name:'',addr:'',interval:'10'};}
 S.party={id:S.saved.id,name:S.saved.name,addr:S.saved.addr}; S.interval=S.saved.interval; if(st!=='sos'&&S.filter==='SOS') S.filter='All';}
document.addEventListener('click',e=>{
 if(e.target.id==='sheetbg'){closeSheet();return;}
 const el=e.target.closest('[data-state],[data-theme],[data-fs],[data-tab],[data-nav],[data-back],[data-go],[data-gotab],[data-fn],[data-iv],[data-dseg],[data-filter],[data-exp]'); if(!el) return; const d=el.dataset;
 if(d.state){setState(d.state);render();return;}
 if(d.theme){S.theme=d.theme;S.pref=d.theme==='day'?'Day':'Night';render();return;}
 if(d.fs){S.fs=+d.fs;render();return;}
 if(d.tab){if(S.tab===d.tab) S.page[d.tab]=d.tab; S.tab=d.tab;render(true);return;}
 if(d.nav){nav(d.nav);return;}
 if(d.back){S.page[S.tab]=S.tab;render(true);return;}
 if(d.go){if(d.gotab)S.tab=d.gotab;S.page[S.tab]=d.go;render(true);return;}
 if(d.gotab){S.tab=d.gotab;S.page[S.tab]=S.tab;render(true,d.anchor);return;}
 if(d.iv){S.interval=d.iv;render();return;}
 if(d.dseg){S.dseg=d.dseg;render(true);return;}
 if(d.filter){S.filter=d.filter;render();return;}
 if(d.exp){closeSheet();toast(d.exp==='cat'?'Opens type / outcome / time controls':d.exp==='off'?'Nothing to export yet':'Opens Android share sheet');return;}
 const fn=d.fn; if(!fn) return;
 if(fn==='start'){setState('tracking');render();toast('Tracking started');}
 else if(fn==='stop') sheet('Stop tracking?','GNSS collection stops. Saved observations stay on this phone and keep sending.','Stop Tracking',true,()=>{setState('fresh');S.saved={...DEMO};S.party={id:DEMO.id,name:DEMO.name,addr:DEMO.addr};render();toast('Tracking stopped');});
 else if(fn==='sync') toast(S.state==='offline'?'Command still unreachable · will retry':'Nothing waiting');
 else if(fn==='recheck'||fn==='recheck2') toast(fn==='recheck'?'Rechecked · 1 issue remains':(S.state==='offline'?'Recheck unavailable; current contact is unconfirmed':'Contact verified just now'));
 else if(fn==='more'){S.more=!S.more;render();}
 else if(fn==='ivsave'){S.saved.interval=ivVal();render();toast('Saved · future observations only');}
 else if(fn==='ivcancel'){S.interval=['5','10','30','60'].includes(S.saved.interval)?S.saved.interval:'custom';S.custom=S.interval==='custom'?S.saved.interval:'';render();}
 else if(fn==='filters') sheet('Filter history',null,'Apply',false,()=>render(),['Applied','Unknown','Rejected'].map(k=>`<div class="row"><div class="tx"><div class="t">${k==='Rejected'?'Rejected / blocked':k}</div></div><div class="sw ${S.outc[k]?'on':''}" role="switch" aria-checked="${S.outc[k]}" onclick="S.outc['${k}']=!S.outc['${k}'];this.classList.toggle('on')"></div></div>`).join('')+`<div class="opt" data-exp="cat"><span class="ico">${ICON.layers}</span><div>Canonical categories<small>Type, outcome and time</small></div></div>`);
 else if(fn==='older') toast('Loads the next page of history');
 else if(fn.startsWith('det:')){const [t,rows,act,dan]=DETAIL[fn.slice(4)](); sheet(t,null,null,false,null,`<div class="group" style="margin:4px 0 14px">${rows.join('')}</div><button class="btn ${dan?'dan':'pri'}" data-fn="${act[0]}">${act[1]}</button>`+(fn==='det:a1'&&!S.alertAck?`<button class="btn sec" data-fn="stopout">Stop output only</button>`:''));}
 else if(fn==='ack'){S.alertAck=true;closeSheet();render();toast('Acknowledged · output stopped');}
 else if(fn==='stopout'){closeSheet();toast('Output stopped · still not acknowledged');}
 else if(fn==='ptest'){S.ptest=!S.ptest;render();}
 else if(fn==='clearkeys') sheet('Clear results?','Clears only physical-key test evidence.','Clear results',true,()=>{S.keys=[];render();});
 else if(['expkeys','expev','expj','expa'].includes(fn)){closeSheet();toast('Opens Android save dialog');}
 else if(fn==='retry') sheet('Retry saved messages?','Retry after correcting a receiver or delivery error. Current Command enrollment and reporting override remain applied.','Retry',false,()=>toast('Retry requested'));
 else if(fn==='save'){S.saved={...S.party,interval:S.interval};render();toast('Saved on this phone');}
 else if(fn==='discard'){S.party={id:S.saved.id,name:S.saved.name,addr:S.saved.addr};S.interval=S.saved.interval;render();}
 else if(fn==='copy'){S._copied=true;render();toast('Copied');}
 else if(fn==='review') sheet('Authorize this Command?','',`Authorize`,false,()=>{setState('tracking');S.cred='';render(true);toast('Command authorized');},
   `<div class="group" style="margin:4px 0 14px"><div class="compare"><div class="k">Command ID</div><div class="mono">c7a1e2d4-5b6f-4a01-8e3c-0d4b2a9f9f20</div></div><div class="compare" style="border-top:1px solid var(--line)"><div class="k">For phone</div><div class="mono">de5bb337-37bc-43b2-ae5e-e41c2b7ea756</div><div class="match">✓ Matches this phone</div></div></div><p>Allows reporting, adaptive storage, Sync and phone alerts from this Command. Saved data stays on this phone.</p>`);
 else if(fn==='disable') sheet('Disable remote control?','New instructions stop. Pending results stay on this phone.','Disable',true,()=>toast('Prototype: remote control disabled'));
 else if(fn==='reenroll') sheet('Re-enroll Command?','The current Command stays authorized until a new credential is approved.','Continue',false,()=>toast('Prototype: re-enrollment started'));
 else if(fn==='export'){const o=on();
  sheet('Export',null,null,false,null,[['box','Diagnostic ZIP','Health, logs and settings',1],['shield','Transfer evidence','Signed delivery records',o],['doc','Instruction journal',o?'4 entries':'No instructions yet',o],['bell','Alert journal',o?'1 alert':'No alerts yet',o]].map(([i,t,s,en])=>`<div class="opt" role="button" data-exp="${en?'on':'off'}" style="${en?'':'opacity:.45'}"><span class="ico">${ICON[i]}</span><div>${t}<small>${s}</small></div></div>`).join(''));}
 else if(fn.startsWith('tog:')){const k=fn.slice(4);S.open[k]=!S.open[k];render();}
 else if(fn==='battery') toast('Opens Android battery settings');
 else if(fn.startsWith('pref:')){S.pref=fn.slice(5);if(S.pref!=='System')S.theme=S.pref==='Day'?'day':'night';render();}
 else if(['adaptive','volume','keytest'].includes(fn)){S[fn]=!S[fn];if(fn==='keytest')S.keys=[];render();}
});
document.addEventListener('input',e=>{const b=e.target.dataset.bind;if(!b)return;const pos=e.target.selectionStart,id=e.target.id;
 if(b==='cred')S.cred=e.target.value; else if(b==='custom')S.custom=e.target.value.replace(/\D/g,''); else if(b==='q')S.q=e.target.value; else S.party[b]=e.target.value; render(); const n=document.getElementById(id); if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet(); if(S.ptest&&S.tab==='diagnostics'&&S.dseg==='tools'&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();S.keys.unshift((e.key==='ArrowUp'?'Volume up':'Volume down')+' · '+new Date().toLocaleTimeString());S.keys=S.keys.slice(0,4);render();}});
(()=>{const h=new URLSearchParams(location.hash.slice(1)); if(h.get('state')) setState(h.get('state')); if(h.get('theme'))S.theme=h.get('theme'); if(h.get('fs'))S.fs=+h.get('fs');
 if(h.get('screen')){nav(h.get('screen'));return;} render(true);})();

</script>
