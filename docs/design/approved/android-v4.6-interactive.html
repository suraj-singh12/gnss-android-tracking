function renderInstructionResults(){const entries=[{name:'Sync All Now',state:'Applied',time:'12:09 PM',tag:'applied'},{name:'Reporting interval',state:'Unknown',time:'12:11 PM',tag:'unknown'},{name:'Unsupported instruction',state:'Rejected / blocked',time:'Earlier',tag:'rejected'}];const results=entries.filter(x=>s.instructionFilters[x.tag]&&(x.name+' '+x.state).toLowerCase().includes(s.instructionSearch.trim().toLowerCase()));return results.length?results.map(x=>`<div class="health"><div class="health-copy"><b>${x.name}</b><small>${x.time} · illustrative record</small></div>${status(x.state,x.tag!=='applied')}</div>`).join(''):'<p class="minor-caption">No records match the current search and filters.</p>'}

<div class="trust-actions">${btn(s.controlDisabled?'Disabled':s.commandTrusted?'Recheck':'Authorize','enroll',s.commandTrusted?'secondary small':'primary small',s.controlDisabled?'disabled':'')}

case'sosJournal':return `<section class="card"><div class="health"><div class="health-copy"><b>Most recent SOS</b><small>${s.sos==='none'?'No new local trigger in this preview':s.sos==='local'?'Created locally · pending transport':'Command durably received'}</small></div>${status(s.sos==='none'?'Ready':s.sos==='local'?'Pending':'Received',s.sos==='local')}</div><div class="note">Command human acknowledgement is an independent operator action.</div></section>`;

function simulateSync(){s.online=true;s.acked+=s.pending;s.pending=0;if(s.sos==='local')s.sos='acked';notify('Transfer and Command durable receipt');render()}
function stopConfirm(){openDialog('Stop tracking?','This ends new GNSS collection, not the retained outbox.',`<p class="note">Pending observations remain stored. SOS and local evidence are independent of this Tracking action.</p>`,btn('Cancel','close-dialog','secondary')+btn('Stop Tracking','confirm-stop','danger'))}
function enrollSteps(){openDialog('Authorize Command','Private, explicit enrollment — not automatic pairing.',`<div class="note">1. On Command, open Phone controls.<p>2. Verify this phone UUID and Command UUID.</p>3. Privately transfer the per-phone credential into Command access.<p>4. Confirm fresh authenticated contact.</p></div>`,btn('Done','close-dialog','primary'))}
function alertPreview(){openDialog('Urgent phone alert','Recipient acknowledgement and sound/vibration are separate.',`<section class="card"><div class="cardhead"><b>Urgent attention</b>${status(s.alerts?'ACK pending':'ACKed',!!s.alerts)}</div><p class="lead">${s.alertOutputActive?'Output requested. Actual sound/vibration cannot be proven from software acknowledgement alone.':'Output stopped locally. Recipient acknowledgement is still outstanding.'}</p></section>`,(s.alertOutputActive?btn('Stop output','stop-alert','secondary'):'')+btn('Acknowledge','ack-alert','primary'))}
function event(e){const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;switch(a){
case'nav':nav(b.dataset.screen);break;
case'sub':sub(b.dataset.sub);break;
case'back':back();break;
case'theme':s.theme=s.theme==='day'?'night':'day';render();break;
case'request-stop':stopConfirm();break;
case'request-start':s.tracking=true;render();notify('Tracking started');break;
case'confirm-stop':s.tracking=false;closeDialog();render();notify('Tracking stopped');break;
case'sync':simulateSync();break;
case'show-gnss':sub('gnss');break;
case'save-party':{const name=$('partyName').value.trim(),addr=$('addr').value.trim(),id=$('partyId').value.trim(),interval=Number($('interval').value);if(!name||!id||!/^https?:\/\//.test(addr)||!Number.isInteger(interval)||interval<5||interval>86400||interval%5){notify('Valid interval: 5–86,400 seconds in steps of 5');break}s.party=name;s.id=id;s.address=addr;s.reporting=String(interval);back();notify('Local settings saved');break}
case'command-trust':sub('trust');break;
case'enroll':{
  if(s.controlDisabled){notify('Remote control disabled locally; use Manage Command access');break}
  if(s.commandTrusted){s.contactState='unavailable';render();notify('No authenticated contact in browser preview');break}
  const raw=$('credential')?.value.trim()||'';
  const parts=raw.split(':');
  const uuid=/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/;
  const valid=parts.length===5&&parts[0]==='gnss1'&&parts.slice(1,4).every(x=>uuid.test(x))&&/^[0-9a-f]{64}$/.test(parts[4]);
  let error='';
  if(!valid)error='Enter a valid gnss1 credential from Command.';
  else if(parts[2]!==s.phoneUuid)error='Credential is for a different phone UUID.';
  if(error){const el=$('credentialError');if(el){el.textContent=error;el.hidden=false}$('credential')?.focus();break}
  s.pendingAuthorityUuid=parts[1];
  $('credential').value='';
  openDialog('Authorize Command?','Compare Command identities before authorizing.',
    `<div class="identity-item"><div class="identity-label">This phone UUID</div><div class="identity-value mono">${escapeHtml(s.phoneUuid)}</div></div>
    <div class="identity-item"><div class="identity-label">Command UUID from credential</div><div class="identity-value mono">${escapeHtml(s.pendingAuthorityUuid)}</div></div>
    <p class="review-note">This preview cannot authenticate the Command computer. Production requires explicit identity comparison and secure enrollment.</p>`,
    btn('Cancel','cancel-enroll','secondary')+btn('Authorize','confirm-enroll','primary')
  );break
}
case'cancel-enroll':s.pendingAuthorityUuid=null;closeDialog();break;
case'confirm-enroll':{
  if(!s.pendingAuthorityUuid){closeDialog();break}
  s.commandAuthorityUuid=s.pendingAuthorityUuid;
  s.pendingAuthorityUuid=null;
  s.commandTrusted=true;
  s.contactState='unverified';
  s.online=false;
  closeDialog();render();notify('Credential enrolled in preview; contact remains unverified');break
}
case'enroll-steps':enrollSteps();break;
case'access-disable':openDialog('Disable remote control?','New instructions will be unavailable; pending results remain retained.',`<p class="note">This affects Command control, not the original GNSS outbox or SOS.</p>`,btn('Cancel','close-dialog','secondary')+btn('Disable','confirm-access-disable','danger'));break;
case'confirm-access-disable':s.controlDisabled=true;s.contactState='unavailable';closeDialog();render();notify('Local disable shown in prototype; no device operation');break;
case'access-reenroll':openDialog('Start re-enrollment?','The current authority must not be silently replaced.',`<p class="note">In production, re-enrollment requires explicit identity comparison and private credential transfer.</p>`,btn('Cancel','close-dialog','secondary')+btn('Continue','confirm-reenroll','primary'));break;
case'confirm-reenroll':s.controlDisabled=false;s.commandTrusted=false;s.commandAuthorityUuid=null;s.contactState='unverified';closeDialog();sub('trust');notify('Re-enrollment flow illustrated; authority not verified');break;
case'permission-guide':openDialog('Field readiness','Open relevant Android system settings on a real device.',`<div class="note">Enable precise location, notifications and appropriate background permissions. OEM battery behavior needs physical verification.</div>`,btn('Close','close-dialog'));break;
case'adaptive':s.adaptive=!s.adaptive;render();notify('Adaptive storage '+(s.adaptive?'enabled':'disabled'));break;
case'save-policy':{const selected=$('reporting').value;const n=selected==='custom'?Number($('customReporting').value):Number(selected);const input=selected==='custom'?$('customReporting'):null;const valid=Number.isInteger(n)&&n>=5&&n<=86400&&n%5===0&&(!input||input.value.trim()!=='');const error=$('reportingError');if(!valid){error.textContent='Enter 5–86,400 seconds in steps of 5.';error.hidden=false;input?.focus();break}error.hidden=true;s.reporting=String(n);s.policyDraft=selected;s.policyDraftCustom=String(n);render();notify('Reporting interval '+n+' s saved in preview');break}
case'volume-shortcut':s.volumeShortcut=!s.volumeShortcut;render();notify('Volume-key shortcut '+(s.volumeShortcut?'on':'off')+' in preview');break;

case'filter-instructions':openDialog('Instruction filter','Show only the selected outcomes.',`${filterSwitch('Applied','Applied',s.instructionFilters.applied)}${filterSwitch('Unknown','Unknown',s.instructionFilters.unknown)}${filterSwitch('Rejected','Rejected / blocked',s.instructionFilters.rejected)}`,btn('Cancel','close-dialog','secondary')+btn('Apply filters','apply-instruction-filters','primary'));break;
case'draft-instruction-filter':{const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',String(on));b.classList.toggle('on',on);break;}
case'apply-instruction-filters':s.instructionFilters={applied:$('fApplied').getAttribute('aria-checked')==='true',unknown:$('fUnknown').getAttribute('aria-checked')==='true',rejected:$('fRejected').getAttribute('aria-checked')==='true'};closeDialog();render();notify('Filter selection updated');break;
case'export':notify('Sanitized diagnostic export (prototype only)');break;
case'retry-saved':notify('Retry requested (prototype only); no receipt has been assumed');break;
case'alert-preview':alertPreview();break;
case'ack-alert':s.alerts=0;s.alertOutputActive=false;closeDialog();render();notify('Recipient ACK illustrated; separate from output stop');break;
case'stop-alert':s.alertOutputActive=false;closeDialog();render();notify('Local output stopped; recipient ACK still pending');break;
case'physical-start':s.physicalTest.listening=true;s.physicalTest.target=null;s.physicalTest.result='Listening for keys';render();break;
case'physical-stop':s.physicalTest.listening=false;s.physicalTest.target=null;s.physicalTest.result='Stopped';render();break;
case'physical-clear':openDialog('Clear physical test results?','Only the test event history is affected.',`<p class="note">This is a prototype-only change; production evidence ownership must remain durable and explicit.</p>`,btn('Cancel','close-dialog','secondary')+btn('Clear results','confirm-physical-clear','danger'));break;
case'confirm-physical-clear':s.physicalTest.history=[];closeDialog();render();notify('Preview test history cleared');break;
case'close-dialog':closeDialog();break;
default:notify('Design interaction') }}
document.addEventListener('click',event);
$('dialogBackdrop').addEventListener('click',e=>{if(e.target===$('dialogBackdrop'))closeDialog()});
document.addEventListener('change',e=>{if(e.target?.id==='reporting'){s.policyDraft=e.target.value;const custom=$('customReportingRow');if(custom){custom.hidden=s.policyDraft!=='custom';if(s.policyDraft==='custom')$('customReporting')?.focus()}const error=$('reportingError');if(error)error.hidden=true}});
document.addEventListener('input',e=>{if(e.target?.id==='customReporting'){s.policyDraftCustom=e.target.value;const error=$('reportingError');if(error)error.hidden=true}if(e.target?.id==='instructionSearch'){s.instructionSearch=e.target.value;const results=$('instructionResults');if(results)results.innerHTML=renderInstructionResults()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.dialog)closeDialog();else if(s.sub)back();return}
const key=e.key==='AudioVolumeUp'||e.key==='VolumeUp'||e.code==='AudioVolumeUp'?'up':e.key==='AudioVolumeDown'||e.key==='VolumeDown'||e.code==='AudioVolumeDown'?'down':null;
